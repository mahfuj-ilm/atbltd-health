name: Deploy to EC2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: base.Dockerfile
          target: frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/atbltd-health-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.atbltd.health/api

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: base.Dockerfile
          target: backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/atbltd-health-backend:latest

  deploy:
    needs: build-and-push
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            # 1. Clean up stale images FIRST to ensure disk space
            docker image prune -af

            # Log in to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull latest images
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/atbltd-health-frontend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/atbltd-health-backend:latest

            # Restart containers with force recreate
            cd /home/ubuntu/apps/atbltd-health
            docker compose down
            docker compose up -d --force-recreate

            # Verify both public application containers before reporting success
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null && \
                 curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker compose ps
                docker compose logs --tail=100 backend frontend
                exit 1
              fi
              sleep 2
            done

            echo "Deployment successful!"

            # 2. Clean up old images after successful deployment
            docker image prune -af
