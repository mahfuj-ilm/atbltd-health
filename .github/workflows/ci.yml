name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        id: eslint
        run: npm run lint

  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check code formatting (Prettier)
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript typecheck
        id: typecheck
        run: npm run typecheck

  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run production dependency security audit
        run: npm audit --workspaces --omit=dev --audit-level=high
      - name: Generate workspace dependency audit artifact (JSON)
        continue-on-error: true
        run: npm audit --workspaces --audit-level=high --json > npm-audit-report.json
      - name: Report dependency freshness across workspaces
        run: |
          echo "=== Dependency Freshness Report ==="
          npm outdated --workspaces || true
          npm outdated --workspaces --json > npm-outdated-report.json || true
      - name: Upload dependency audit and freshness artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: |
            npm-audit-report.json
            npm-outdated-report.json
          if-no-files-found: warn

  build:
    name: Build
    needs: [lint, format, typecheck, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build applications
        run: npm run build

  test:
    name: Unit Tests with Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Jest unit tests with coverage (fails below coverageThreshold)
        id: jest
        run: npm run test:cov
      - name: Enforce numeric coverage thresholds
        run: npm run coverage:check
      - name: Upload combined coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage
          path: |
            apps/backend/coverage/**
            apps/frontend/coverage/**
          if-no-files-found: warn

  test-e2e:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Start disposable test database
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Run backend e2e tests
        id: e2e
        env:
          DB_HOST: localhost
          DB_PORT: "5433"
          DB_USERNAME: atbtest
          DB_PASSWORD: atbtest
          DB_DATABASE: atbltd_test
          JWT_SECRET: ci-e2e-test-secret
          TEST_MEMBER_PASSWORD: ci-e2e-member-password
          SMS_DISABLED: "true"
        run: npm run test:e2e:backend
      - name: Tear down test database
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Start disposable migration database
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Apply migrations to empty database
        env:
          DB_HOST: localhost
          DB_PORT: "5433"
          DB_USERNAME: atbtest
          DB_PASSWORD: atbtest
          DB_DATABASE: atbltd_test
        run: npm run migration:run --workspace=@atbltd-health/backend
      - name: Tear down migration database
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
